name: build-and-push

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: on tag builds the SBOM step creates the GitHub release if
      # one does not exist, then uploads the SPDX document to it
      contents: write
      packages: write
      # Required for Cosign keyless (OIDC token exchange with Sigstore)
      id-token: write
      # Required to upload the Grype SARIF report to the Security tab
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Buildx is required for multi-platform builds (BuildKit)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Generate tags/labels:
      # - branch name on branch pushes
      # - v1.0.1 (exact tag) and latest on tag pushes
      # - sha-... (immutable traceability)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
            type=sha

      # GHCR login -- skipped on PRs (no write access from forks)
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build (and push on non-PR runs)
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}
          # Bind an SPDX SBOM and SLSA provenance to the pushed digest. Registry
          # attestations on the manifest list, not files — they require the
          # docker-container driver (setup-buildx-action's default) and a push, so
          # they only materialise on the non-PR runs that actually push.
          #
          # No BUILDKIT_SBOM_SCAN_STAGE here: the Dockerfile is a single stage, so
          # everything the image contains is in the final stage already. Add it if
          # this ever becomes a multi-stage build.
          sbom: true
          provenance: mode=max

      # Scan the published digest.
      #
      # BLOCKING as of 2026-08-08, after the findings were reduced and the residue
      # dispositioned. The path taken, in order — reduce first, assert only last:
      #
      #   python:3.14           1949 findings   444 high or critical
      #   python:3.14-slim       177 findings    30
      #   python:3.14-alpine      12 findings     3
      #   + .vex/openvex.json                     0 unsuppressed
      #
      # The final 3 are in CPython itself (tarfile x2, html.parser) and are fixed only
      # in 3.15.0b4/3.15.0 — an unreleased major version — so no base change removes
      # them. Every alternative was measured and is worse: Alpine's apk python3 ships
      # 3.14.5 (5 blocking) and distroless/python3 is 3.11 on Debian 12 (55 blocking).
      #
      # They are dispositioned as not_affected / vulnerable_code_not_in_execute_path,
      # on evidence rather than assertion: the app's import set loads 116 modules and
      # neither tarfile nor html.parser is among them. See .vex/openvex.json for the
      # per-CVE reasoning and the conditions that void each statement.
      #
      # If this starts failing, the finding is NEW and real. Fix it, remove the
      # package, or change the base. Do NOT raise severity-cutoff, do NOT delete this
      # step, and do NOT add a VEX statement without evidence the code is unreachable.
      - name: Scan the published image for CVEs
        id: scan
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          fail-build: true
          vex: .vex/openvex.json
          output-format: sarif

      - name: Upload the scan results
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

      # Sign the published image with Cosign keyless (OIDC -> Sigstore transparency log)
      # Only runs when an image was actually pushed (not on PRs)
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}@${DIGEST}"
          done
          cosign sign --yes ${images}

      # Export the SBOM attestation as a release record. Tag builds only — a branch
      # push has no release to attach to.
      #
      # The registry attestation is the source of truth; this file is a convenience
      # copy for reading the inventory without a registry client, and the two can
      # drift. The platform key shape is asserted rather than assumed: this build is
      # currently single-platform, so rather than hardcode linux/amd64 the step reads
      # whatever keys are actually present and fails loudly on none.
      - name: Export the SBOM as a release record
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${DIGEST}"
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom-raw.json

          echo "SBOM top-level keys:"
          jq -r 'keys[]' sbom-raw.json

          # Single-platform builds key the SPDX document at the top level;
          # multi-platform builds key it per platform. Handle both.
          #
          # Each stage marked BUILDKIT_SBOM_SCAN_STAGE=true also produces its own
          # document under AdditionalSPDXs, which buildkit does NOT merge into .SPDX.
          # This Dockerfile is single-stage today so there are none — but exporting
          # only .SPDX is the bug that shipped in the multi-stage repos on 2026-08-05,
          # dropping 479 packages from pastebooks and 1815 from eng-tools. Handled
          # here now so it cannot reappear the day this becomes multi-stage.
          # $1 = jq path PREFIX to the container — empty string for the document root,
          #      or .["<platform>"]. Not "." for the root: "$1.SPDX" would then render
          #      as "..SPDX", which is a jq syntax error. That shipped in v4.0.2.
          # $2 = output filename prefix
          export_doc() {
            jq -e "$1.SPDX" sbom-raw.json > "$2.spdx.json"
            echo "$2.spdx.json: $(jq '.packages | length' "$2.spdx.json") packages"
            n=$(jq "$1.AdditionalSPDXs? // [] | length" sbom-raw.json)
            i=0
            while [ "$i" -lt "$n" ]; do
              name=$(jq -r --argjson i "$i" "$1.AdditionalSPDXs[\$i].name // \"stage\(\$i)\"" sbom-raw.json)
              jq -e --argjson i "$i" "$1.AdditionalSPDXs[\$i]" sbom-raw.json > "$2.${name}.spdx.json"
              echo "$2.${name}.spdx.json: $(jq '.packages | length' "$2.${name}.spdx.json") packages"
              i=$((i + 1))
            done
          }

          if jq -e '.SPDX' sbom-raw.json >/dev/null 2>&1; then
            export_doc '' sbom
          else
            for plat in $(jq -r 'keys[]' sbom-raw.json); do
              export_doc ".[\"$plat\"]" "sbom.${plat//\//-}"
            done
          fi

          # An empty SBOM looks exactly like a passing one. Fail rather than publish
          # a document that asserts an image contains nothing.
          for f in sbom*.spdx.json; do
            [ "$(jq '.packages | length' "$f")" -gt 0 ] || { echo "::error::$f is empty"; exit 1; }
          done

      # This repo publishes tags but has never created a GitHub release, so there is
      # nothing for `gh release upload` to attach to. Create it first.
      - name: Attach the SBOM to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG — creating one."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" sbom*.spdx.json --clobber
